name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-4aea66b2-89e7-498a-969a-8a54e24364b5-1776432306752
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-4aea66b2-89e7-498a-969a-8a54e24364b5-1776432306752/package-lock.json
      - run: npm ci
      - run: npm run build
